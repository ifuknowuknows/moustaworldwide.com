# Pages CMS (app.pagescms.org): edit the English texts and the startup list.
# Saving runs the "Build site" action: it translates changed lines into the other 7 languages and rebuilds the pages.
content:
  - name: site
    label: Website (English decides)
    type: file
    path: site-src/en.json
    format: json
    fields:
      - name: title
        label: "Browser tab · Title"
        type: string
      - name: meta_desc
        label: "Google and link previews · Description"
        type: text
      - name: k000
        label: "Menu · Wordmark"
        type: string
        description: "Brand line: stays in English on every language page."
      - name: k001
        label: "Menu · Vision"
        type: string
      - name: k002
        label: "Menu · Work"
        type: string
      - name: k003
        label: "Menu · Writing"
        type: string
      - name: k004
        label: "Menu · Contact"
        type: string
      - name: k_cta
        label: "Main button (Email me)"
        type: string
      - name: k_menu
        label: "Phone menu · Label for screen readers"
        type: string
      - name: k_skip
        label: "Skip link for keyboard users"
        type: string
      - name: k005
        label: "Hero · Name above the headline"
        type: string
      - name: k006
        label: "Hero · Headline"
        type: string
      - name: k007
        label: "Hero · Subtitle"
        type: string
