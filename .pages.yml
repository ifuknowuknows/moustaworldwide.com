      - name: k065
        label: "Writing · Small label"
        type: string
      - name: k066
        label: "Writing · Heading (letter name)"
        type: string
        description: "Brand line: stays in English on every language page."
      - name: k067
        label: "Writing · Text"
        type: text
      - name: k069
        label: "Writing · Subscribe link"
        type: string
