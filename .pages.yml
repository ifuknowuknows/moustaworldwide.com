        label: "Social link · Substack"
        type: string
      - name: k083
        label: "Footer · Copyright"
        type: string
      - name: k084
        label: "Footer · Line"
        type: string
        description: "Brand line: stays in English on every language page."
      - name: k_priv
        label: "Footer · Privacy link"
        type: string
      - name: k009
        label: "(not shown on the page)"
        type: string
        hidden: true
      - name: ventures
        label: "Startups and projects (Work section, in this order)"
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
        fields:
          - name: name
            label: Name
            type: string
            required: true
            description: "Shown as written in every language (brand names stay lowercase)."
          - name: text
            label: One line about it
            type: text
          - name: status
            label: Your role or status
            type: string
            description: "e.g. Board member, Founder, In development"
          - name: link
            label: Link (optional)
            type: string
            description: "Full address starting with https://. Leave empty for no link."
