        label: "Contact · Heading"
        type: string
      - name: k072
        label: "Contact · Text"
        type: string
      - name: k073
        label: "Contact · Email address (also used by every Email me button)"
        type: string
        pattern:
          regex: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
          message: "Enter an email address, like name@domain.com"
      - name: k074
        label: "Bio · Small label"
        type: string
