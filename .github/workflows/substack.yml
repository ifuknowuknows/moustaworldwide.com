name: Update writing from Substack
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the Substack feed
        run: |
          python3 - <<'PY'
          import json, os, re, html, urllib.request, xml.etree.ElementTree as ET
          url = "https://moustaworldwide.substack.com/feed"
          try:
              req = urllib.request.Request(url, headers={"User-Agent": "moustaworldwide-site"})
              root = ET.fromstring(urllib.request.urlopen(req, timeout=30).read())
          except Exception as e:
              print("Feed not available yet:", e)
              raise SystemExit(0)
          items = []
          for it in root.iter("item"):
              text = re.sub(r"<[^>]+>", "", html.unescape(it.findtext("description") or "")).strip()
              items.append({"title": it.findtext("title"), "link": it.findtext("link"),
                            "date": it.findtext("pubDate"), "summary": text[:180]})
          if items:
              json.dump(items[:12], open("writing.json", "w"), ensure_ascii=False, indent=1)
          PY
      - name: Save changes
        run: |
          git config user.name "site-bot"
          git config user.email "site-bot@users.noreply.github.com"
          git add writing.json
          git diff --cached --quiet || (git commit -m "Update writing" && git push)
